# Neon Relay on-chain rewards program (stage 9).
#
# CLUSTER POLICY: devnet only. The reward mint is NOT part of this file —
# it is passed to `initialize` at deployment time and must be a throwaway
# devnet test mint (onchain/scripts/create_test_mint.sh). No mainnet mint is
# configured anywhere in this repository.
[toolchain]
anchor_version = "0.31.1"

[features]
seeds = false
skip-lint = false

[programs.devnet]
# Source IDs are pinned and checked by verify_source_ids.mjs. A live manifest,
# finalized RPC read and upgrade-authority verification are still required.
neonrelay_rewards = "2RaaXKUutemHtSZUsmnEv41ytWMkaXD6rcoziHGLRtmj"
neonrelay_features = "4PH1dHVBRbfoydBx3SuRjAS46zRRjHvRxWCNcrFBDqYP"
neonrelay_economy = "FZcLDdUrs6i1HYFFK2NhqNrbVaP6KTvrqzhyoDGT6CV9"
neonrelay_assets = "F5VhZxGGEY61TNNexRwJVomMZtHeAZodqVHPMqoxq3oc"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npm run test"

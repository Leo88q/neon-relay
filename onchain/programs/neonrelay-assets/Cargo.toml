[package]
name = "neonrelay-assets"
version = "0.1.0"
edition = "2021"
description = "Neon Relay source-gated assets: bounded collection metadata and classic SPL badge fallback; external MPL-Core/Bubblegum CPI remains disabled until ABI and validator review."

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# These flags are reserved only. Enabling either is a compile-time error until
# the exact upstream CPI crates/ABI are pinned and validator tests are enabled.
# The default verified build is fail-closed and returns AssetPathNotConfigured.
core = []
bubblegum = []
# light = ["light-compressed-token"]

[dependencies]
# Production pin; the lockfile and connected build environment must resolve the same release.
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
bincode = "1.3.3"

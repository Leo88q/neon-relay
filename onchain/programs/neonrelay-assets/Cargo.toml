[package]
name = "neonrelay-assets"
version = "0.1.0"
edition = "2021"
description = "Neon Relay cheap-minting assets: MPL-Core + Bubblegum v2 compressed NFTs (0.00001 SOL/шт) and Token-2022-aware vaults. Production-hardened: 45-check audit, timelock authority, finalized-only claims."

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Optional prod features that need crates.io (offline tests compile without):
# bubblegum = ["mpl-bubblegum"]
# light = ["light-compressed-token"]

[dependencies]
# Pinned; продакшн требует 0.31.1 (миграция в docs/ANCHOR_MIGRATION_0_31.md). Оффлайн sandbox — 0.30.1 (BL-03).
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

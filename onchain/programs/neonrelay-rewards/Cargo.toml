[package]
name = "neonrelay-rewards"
version = "0.1.0"
edition = "2021"
description = "Neon Relay reward epochs: operator publishes Merkle roots, each (epoch, wallet) leaf pays exactly once. Devnet test mints only; no mint is hardcoded."

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Production pin; run `cargo test --locked` / `anchor build` in the release environment.
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
bincode = "1.3.3"

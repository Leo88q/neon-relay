[package]
name = "neonrelay-rewards"
version = "0.1.0"
edition = "2021"
description = "Neon Relay reward epochs: operator publishes Merkle roots, each (epoch, wallet) leaf pays exactly once. Devnet test mints only; no mint is hardcoded."

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Pinned; NOT verifiable in the offline sandbox (docs/KNOWN_LIMITATIONS.md BL-03/BL-06).
# Run `cargo update --dry-run` / `anchor build` on a connected machine to confirm.
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

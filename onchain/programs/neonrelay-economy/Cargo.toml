[package]
name = "neonrelay-economy"
version = "0.1.0"
edition = "2021"
description = "Neon Relay pay-to-play economy: SKR-denominated match/tournament entry fees (operator-configured mint), rake sweep to the operator treasury, epoch prize vault and Merkle-claimed top-10 payouts. Game simulation stays off-chain."

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Production pin; cargo test/build must be run in a connected release environment.
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
bincode = "1.3.3"

[dev-dependencies]
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
solana-client = "=1.18.26"
serde_json = "1"

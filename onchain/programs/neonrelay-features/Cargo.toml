[package]
name = "neonrelay-features"
version = "0.1.0"
edition = "2021"
description = "Neon Relay non-simulation on-chain features: achievement registry, unique supply-1 badge tokens, published epoch leaderboards and free tournament registration. Gameplay itself never touches the chain."

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Pinned; NOT verifiable in the offline sandbox (docs/KNOWN_LIMITATIONS.md BL-03/BL-06).
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

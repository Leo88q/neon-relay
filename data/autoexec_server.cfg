# Neon Relay dedicated-server defaults.
#
# This file runs automatically at server start. Every setting below is also
# documented in src/engine/shared/config_variables.h and in the in-game
# Settings menu. A '#' starts a comment; switches use 1 for on, 0 for off.
#
# Put your own overrides into myServerconfig.cfg (executed at the end of this
# file) so that Neon Relay updates never overwrite them.


# GENERAL
# -------

# Port to listen on. Only 8303-8310 appear in the LAN browser tab; 0 picks a
# free port in that range automatically.
#sv_port 8303

# Public server name shown in the browser.
sv_name "My Neon Relay server"

# Join password, empty means no password.
password ""

# Admin rcon password (F2 console). Left empty, the server prints a random one
# to its terminal at startup.
#sv_rcon_password ""

# Moderator rcon password. Empty means no moderator login exists.
sv_rcon_mod_password ""

# Helper rcon password. Empty means no helper login exists.
sv_rcon_helper_password ""

# Map the server starts on.
sv_map "Tutorial"

# Test server: rcon cheats allowed, flagged as such in the server browser.
# Protocol identifier strings are inherited from upstream for compatibility.
sv_test_cmds 1

# Register with the master server (list publicly).
sv_register 0


# ADVANCED
# --------

# Server log file.
logfile "autoexec_server.log"

# Log verbosity: -3 none, -2 error, -1 warning, 0 info, 1 debug, 2 trace.
loglevel 0

# Maximum connected players.
sv_max_clients 128

# Maximum connections from a single IP address.
sv_max_clients_per_ip 4

# Tournament mode: newcomers join as spectators.
sv_tournament_mode 0

# Allow /spec so players can park their character as a spectator.
sv_pauseable 0

# Allow /rescue (and /r) to teleport out of freeze.
sv_rescue 1
# Cooldown in seconds between two rescues.
sv_rescue_delay 5


# CUSTOMIZATION
# -------------

# Chat greeting shown to joining players.
sv_welcome "Welcome to my server!"

# File with rotating announcements, one per line.
sv_announcement_filename "announcement.txt"

# Minutes between announcements taken from that file.
sv_announcement_interval 120

# Pick announcements randomly (1) or in file order (0).
sv_announcement_random 1

# Message of the day on join ("\n" starts a new line).
sv_motd "Neon Relay test server with race features!\nDon't forget to check the server rules by using /rules"

# Use the built-in race rules text.
sv_ddrace_rules 1

# Custom rules, up to 10 lines.
sv_rules_line1 ""
sv_rules_line2 ""
sv_rules_line3 ""

# Restore default physics tuning on every map change.
sv_tune_reset 1

# Restore default race tuning on every map change.
sv_ddrace_tune_reset 1

# Extra config executed on every map change.
sv_reset_file "reset.cfg"


# CUSTOM VOTES
# ------------

# add_vote "<vote name>" "<command 1>; <command 2>; ..."
# Example: add_vote "Close server" "sv_name Private Neon Relay server; password My secret password"
#
# A vote whose name is only blank characters renders as a separator line in
# the vote menu ("info" command). Plain ASCII spaces do not work here: the
# server trims them and rejects the empty name, so separators use EN SPACE
# (U+2002) instead, with a different count per line to stay unique.
# Example: add_vote "\u2002" "info"
#
# Physics tunables are listed by the console command 'tune'
# (see tune_reset / tune_lock).

add_map_votes
add_vote " " "info"
add_vote "Option: Normal gravity" "tune gravity 0.50"
add_vote "Option: Moon gravity" "tune gravity 0.25"
add_vote "Option: No gravity" "tune gravity 0.00"
add_vote "  " "info"
add_vote "Option: Reset server" "exec autoexec_server.cfg"
add_vote "Option: Shutdown server" "shutdown"


# Silence stdout while changing access levels below; the log file keeps its
# own level because these settings apply only after the whole file is read.
stdout_output_level -1

# COMMAND PERMISSIONS
# -------------------

# "access_status <0 admin, 1 moderator, 2 helper, 3 user>" lists which commands
# each level may run.
#
# "access_level <command> <admin|moderator|helper>" grants a command to a level
# and everyone above it.
# Example: access_level ban moderator

# Extra commands shared with moderators and helpers.
access_level left helper
access_level right helper
access_level up helper
access_level down helper
access_level super helper
access_level unsuper helper
access_level tele helper
access_level totele helper
access_level totelecp helper
access_level logout helper
access_level ninja helper
access_level grenade helper
access_level shotgun helper
access_level laser helper
access_level weapons helper
access_level unweapons helper
access_level unlaser helper
access_level unshotgun helper
access_level ungrenade helper
access_level unsolo helper
access_level undeep helper
access_level status helper

# Commands reserved for moderators (and admins).
access_level ban moderator
access_level unban moderator
access_level ban_range moderator
access_level unban_range moderator
access_level unban_all moderator
access_level bans moderator
access_level bans_save moderator
access_level kick moderator
access_level force_vote moderator
access_level moderate moderator


# Restore normal stdout verbosity.
stdout_output_level 0

# CLIENT SUGGESTIONS
# ------------------

# Hint broadcast to players joining without a Neon Relay client.
sv_client_suggestion "Get the Neon Relay client to use all features on this server!"

# Hint for players on a very old client version.
sv_client_suggestion_old "Your Neon Relay client is old, please update it!"

# Warning for players on a botting client that can be remote-controlled.
sv_client_suggestion_bot "Your client has bots and can be remotely controlled!\nPlease use another client, for example the official Neon Relay client"



# CUSTOM CONFIG
# -------------

# Server-owner overrides live here so updates stay safe.
exec myServerconfig.cfg

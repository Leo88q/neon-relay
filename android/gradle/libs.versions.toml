# Version catalog for the Neon Relay Android / Solana Mobile module.
#
# The Mobile Wallet Adapter pin is verified against the upstream repository tag:
#   https://github.com/solana-mobile/mobile-wallet-adapter tag v2.2.0
#   commit 25296e124c5fdc30dc89f1ac0622b8cffefc5c8e
# (Maven Central is unreachable from the CI sandbox, so artifact availability is
# confirmed by the first real Gradle build; see docs/KNOWN_LIMITATIONS.md BL-06.)
[versions]
agp = "8.13.0"
kotlin = "2.0.21"
mwa = "2.2.0"
coroutines = "1.9.0"
lifecycle = "2.8.7"
activity = "1.9.3"
securityCrypto = "1.1.0-alpha06"
junit = "4.13.2"

[libraries]
mobilewalletadapter-clientlib = { module = "com.solana:mobile-wallet-adapter-clientlib", version.ref = "mwa" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

# Version catalog for the Neon Relay Android / Solana Mobile module.
#
# The Mobile Wallet Adapter artifact is published on Maven Central under the
# group com.solanamobile (NOT com.solana): the clientlib-ktx AAR provides the
# Kotlin MobileWalletAdapter API our wallet layer compiles against. Version
# 2.0.8 is the newest publication verified via the Central search API
# (first real Gradle build on the operator machine confirmed resolution;
# see docs/KNOWN_LIMITATIONS.md BL-06).
[versions]
agp = "8.13.0"
kotlin = "2.0.21"
mwa = "2.0.8"
coroutines = "1.9.0"
lifecycle = "2.8.7"
activity = "1.9.3"
securityCrypto = "1.1.0-alpha06"
junit = "4.13.2"

[libraries]
mobilewalletadapter-clientlib = { module = "com.solanamobile:mobile-wallet-adapter-clientlib-ktx", version.ref = "mwa" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

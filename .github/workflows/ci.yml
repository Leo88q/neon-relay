# Offline gates plus Linux server linking/boot and native TLS interoperability.
# Client graphics/Android builds and live wallet transport remain separate gates.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branding scan, asset manifest validation, secret scan and the repository
  # hygiene checks. Pure Python stdlib + bash; no system packages needed.
  gates:
    name: branding / assets / secrets / hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          # Atlas regression compares pixels to the pre-potato baseline commit.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned image build dependencies
        run: python -m pip install -r scripts/requirements-assets.txt
      - name: Install pinned development map I/O tools
        run: python -m pip install -r scripts/requirements-map-tools.txt
      - name: Potato assets and native catalog regression checks
        run: |
          python3 scripts/test_potato_assets.py
          python3 scripts/test_ui_sheet_grids.py
          python3 scripts/test_map_catalog.py
          python3 scripts/test_landing_pages.py
          python3 scripts/test_menu_contract.py
          python3 scripts/test_map_format.py
          python3 scripts/test_reference_maps.py
          python3 scripts/test_twmap_pipeline.py
          python3 scripts/test_warmup.py
          python3 scripts/test_warmup_server_contract.py
      - name: Secret scan (self-test first, so a broken scanner cannot pass)
        run: |
          python3 scripts/check_secrets.py --self-test
          python3 scripts/check_secrets.py
      # SW-2026-AGI (threat 76): the repository is what the Watchtower audit
      # assistant reads — invisible Unicode and instruction-shaped comments
      # are an audit-poisoning channel and gate every commit.
      - name: AI-injection scan (self-test first, so a broken scanner cannot pass)
        run: |
          python3 scripts/check_ai_injection.py --self-test
          python3 scripts/check_ai_injection.py
      # Catalog 2026 §AH/§AJ (items 107, 115, 128, 130): release profiles keep
      # overflow checks, the Rust toolchain stays pinned, lockfiles carry
      # integrity hashes, no package runs install scripts, CI never installs
      # without --ignore-scripts.
      - name: Supply-chain gates (self-test first)
        run: |
          python3 scripts/check_supply_chain.py --self-test
          python3 scripts/check_supply_chain.py
      # Catalog 2026 §AE/AI (items 99, 120, 121, 125, 126): every privileged
      # key has a provenance record — vendor, firmware, entropy source,
      # custody, location, rotation date — and the record passes rules.
      - name: Key-provenance gate (self-test first)
        run: |
          python3 scripts/check_key_provenance.py --self-test
          python3 scripts/check_key_provenance.py
      # Catalog 2026 §AD (items 104, 105, 119): the landing origin stays
      # same-origin and strictly CSP'd, and the served bundle hashes are
      # pinned so any change is visible in review.
      - name: Landing integrity (self-test first)
        run: |
          python3 scripts/check_landing_integrity.py --self-test
          python3 scripts/check_landing_integrity.py
      - name: Branding scan (release mode) + translation lockstep
        run: ./scripts/check_branding.sh --release --check-translations
      - name: Generated skins match the generator (determinism)
        run: python3 scripts/test_potato_assets.py
      - name: Generated UI art matches the generator (determinism)
        run: python3 scripts/build_neon_ui_art.py --check
      - name: Potato Arena backdrops / icon atlas match the bake (determinism)
        # The check explains itself (which pixels differ, on which versions). Capture it instead of
        # piping it: `run:` executes with `set -e`, so a failing pipeline would abort the step before
        # the diagnosis is reported. The report goes to the job summary and, line by line, to
        # check-run annotations — both are readable from the API when the raw log is not.
        run: |
          status=0
          python3 scripts/build_potato_arena_assets.py --check > /tmp/bake-check.log 2>&1 || status=$?
          cat /tmp/bake-check.log
          if [ "$status" -ne 0 ]; then
            {
              echo "### Bake determinism mismatch"
              echo '```'
              cat /tmp/bake-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              case "$line" in
                *DIFF*|*MISSING*|*environment*|*Traceback*|*Error*|*error*) echo "::warning::$line" ;;
              esac
            done < /tmp/bake-check.log
            exit "$status"
          fi
      - name: Map blueprints match the map builders (determinism)
        run: python3 scripts/build_map_previews.py --check
      - name: Asset manifest validation (coverage, hashes, license texts)
        run: ./scripts/check_assets.sh --licenses
      - name: Config variables unused-check
        run: python3 scripts/check_config_variables.py
      - name: Header guards
        run: python3 scripts/check_header_guards.py
      - name: CMake tidy-alphabetical lists
        run: python3 scripts/tidy_alphabetical.py --dry-run
      - name: Standard C headers
        run: python3 scripts/check_standard_headers.py


  # Supply-chain: lockfile audits, OSV, container lint and filesystem vuln scan.
  # Advisory gates before shipping — fail on HIGH/CRITICAL. Uses pinned SHAs.
  supply-chain:
    name: supply-chain (audit / osv / hadolint / trivy fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (HIGH/CRITICAL gate)
        run: |
          npm --prefix backend audit --audit-level=high || (echo "::error::backend npm audit HIGH/CRITICAL"; exit 1)
          npm --prefix onchain audit --audit-level=high || (echo "::error::onchain npm audit HIGH/CRITICAL"; exit 1)
      - name: OSV scanner (lockfiles recursive)
        uses: google/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # google/osv-scanner-action@v2.6.0
        with:
          scan-args: --recursive --format=sarif --output=osv.sarif .
        continue-on-error: true
      - name: Upload OSV SARIF (advisory)
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action@v4.38.2
        with:
          sarif_file: osv.sarif
          category: osv-scanner
        continue-on-error: true
      - name: Hadolint (Dockerfile lint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Trivy filesystem scan (HIGH/CRITICAL, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        continue-on-error: true
      - name: Upload Trivy SARIF (advisory)
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action@v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        continue-on-error: true

  # CodeQL for JavaScript/TypeScript (backend + onchain) — supply-chain SAST.
  codeql:
    name: CodeQL (js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action@v4.38.2
        with:
          languages: javascript
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action@v4.38.2
        continue-on-error: true
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action@v4.38.2
        with:
          category: /language:javascript

  # Syntax-checks every server/base/shared/game C++ translation unit with the
  # bundled headers (the full engine build needs SDL2/Vulkan/Rust — BL-01).
  cpp-syntax-probe:
    name: C++ syntax probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Neon DM compiled rules and opt-in contracts
        run: python3 scripts/test_neon_dm.py
      - name: Original course native physics and negative controls
        run: python3 scripts/test_warmup_physics.py --sanitize
      - name: Codegen + translation-unit probe
        run: |
          ./scripts/local_syntax_probe.sh
          ./scripts/check_menu_syntax.sh
      - name: Compile native HTTP transport with curl headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          g++ -std=c++20 -fsyntax-only -Isrc -I/tmp/neonrelay-syntax-probe/src -Isrc/engine/external \
            src/engine/http.cpp src/engine/shared/http_curl.cpp src/neonrelay/game_pairing_http.cpp

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute native HTTP worker against isolated TLS servers
        shell: bash
        run: |
          set -o pipefail
          if ! ./scripts/test_native_https.sh 2>&1 | tee "$RUNNER_TEMP/native-https.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          tail = Path(os.environ["RUNNER_TEMP"], "native-https.log").read_text()[-3500:]
          print("::error::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
            exit 1
          fi

  native-server:
    name: Linux server build and isolated boot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Install server build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config libcurl4-openssl-dev libssl-dev libsqlite3-dev zlib1g-dev
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Compile and boot actual server target
        env:
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: |
          set -o pipefail
          if ! ./scripts/test_native_server.sh 2>&1 | tee "$RUNNER_TEMP/native-server.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          tail = Path(os.environ["RUNNER_TEMP"], "native-server.log").read_text()[-3500:]
          print("::error::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
            exit 1
          fi

  native-client:
    name: Linux client build and desktop/portrait boot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Install client toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config libcurl4-openssl-dev libssl-dev libsqlite3-dev zlib1g-dev libsdl2-dev libfreetype6-dev libogg-dev libopus-dev libopusfile-dev libpng-dev libwavpack-dev libglew-dev libnotify-dev xvfb xauth xdotool imagemagick
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development map fixture tools
        run: python -m pip install -r scripts/requirements-map-tools.txt
      - name: Compile and render native client
        env:
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: |
          set -o pipefail
          if ! ./scripts/test_native_client.sh 2>&1 | tee "$RUNNER_TEMP/native-client.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          logs = list((root / "client-preview").glob("*.log")) + [root / "native-client.log"]
          tail = "\n".join(p.read_text(errors="replace")[-2200:] for p in logs)[-3500:]
          print("::error::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-preview
          path: ${{ runner.temp }}/client-preview/
          retention-days: 7

  # Builds the vendored ed25519-donna + match signer + CLI tool with plain
  # gcc/g++, signs fixed vectors and cross-verifies with node:crypto.
  match-signer:
    name: match-event signer (C++ <-> node:crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      - name: Signer harness
        run: ./scripts/neonrelay_signer_test.sh

  backend:
    name: reward backend (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      - name: Tool description pins match the registry (SW-2026-AGI V78)
        run: cd backend && npm run check:tool-pins
      - name: Tests (zero runtime dependencies, no install step needed)
        run: cd backend && npm test
      - name: Load smoke — rate limiters shed, nothing breaks (load_test.ts)
        run: cd backend && npm run load:smoke
      - name: Mutation smoke — tests pin the guards (scripts/mutation_test.py)
        run: python3 scripts/mutation_test.py --smoke

  onchain:
    name: anchor program offline checks (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      - name: Merkle parity + program conformance tests
        run: cd onchain && npm test

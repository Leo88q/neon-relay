# Offline gates plus Linux server linking/boot and native TLS interoperability.
# Client graphics/Android builds and live wallet transport remain separate gates.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branding scan, asset manifest validation, secret scan and the repository
  # hygiene checks. Pure Python stdlib + bash; no system packages needed.
  gates:
    name: branding / assets / secrets / hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Atlas regression compares pixels to the pre-potato baseline commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned image build dependencies
        run: python -m pip install -r scripts/requirements-assets.txt
      - name: Install pinned development map I/O tools
        run: python -m pip install -r scripts/requirements-map-tools.txt
      - name: Potato assets and native catalog regression checks
        run: |
          python3 scripts/test_potato_assets.py
          python3 scripts/test_ui_sheet_grids.py
          python3 scripts/test_map_catalog.py
          python3 scripts/test_landing_pages.py
          python3 scripts/test_menu_contract.py
          python3 scripts/test_map_format.py
          python3 scripts/test_reference_maps.py
          python3 scripts/test_twmap_pipeline.py
          python3 scripts/test_warmup.py
          python3 scripts/test_warmup_server_contract.py
      - name: Secret scan (self-test first, so a broken scanner cannot pass)
        run: |
          python3 scripts/check_secrets.py --self-test
          python3 scripts/check_secrets.py
      - name: Branding scan (release mode) + translation lockstep
        run: ./scripts/check_branding.sh --release --check-translations
      - name: Generated skins match the generator (determinism)
        run: python3 scripts/test_potato_assets.py
      - name: Generated UI art matches the generator (determinism)
        run: python3 scripts/build_neon_ui_art.py --check
      - name: Potato Arena backdrops / icon atlas match the bake (determinism)
        # The check explains itself (which pixels differ, on which versions); pipe it into the job
        # summary so a CI-only mismatch can actually be read back from the run page.
        run: |
          set -o pipefail
          python3 scripts/build_potato_arena_assets.py --check 2>&1 | tee /tmp/bake-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Bake determinism mismatch"
              echo '```'
              cat /tmp/bake-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotations travel with the check run, so the diagnosis can be read from the API even
            # when the raw job log is not reachable.
            while IFS= read -r line; do
              case "$line" in
                *DIFF*|*MISSING*|*environment*|*Error*|*error*) echo "::warning::$line" ;;
              esac
            done < /tmp/bake-check.log
          fi
          exit "$status"
      - name: Map blueprints match the map builders (determinism)
        run: python3 scripts/build_map_previews.py --check
      - name: Asset manifest validation (coverage, hashes, license texts)
        run: ./scripts/check_assets.sh --licenses
      - name: Config variables unused-check
        run: python3 scripts/check_config_variables.py
      - name: Header guards
        run: python3 scripts/check_header_guards.py
      - name: CMake tidy-alphabetical lists
        run: python3 scripts/tidy_alphabetical.py --dry-run
      - name: Standard C headers
        run: python3 scripts/check_standard_headers.py

  # Syntax-checks every server/base/shared/game C++ translation unit with the
  # bundled headers (the full engine build needs SDL2/Vulkan/Rust — BL-01).
  cpp-syntax-probe:
    name: C++ syntax probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Neon DM compiled rules and opt-in contracts
        run: python3 scripts/test_neon_dm.py
      - name: Original course native physics and negative controls
        run: python3 scripts/test_warmup_physics.py --sanitize
      - name: Codegen + translation-unit probe
        run: |
          ./scripts/local_syntax_probe.sh
          ./scripts/check_menu_syntax.sh
      - name: Compile native HTTP transport with curl headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev
          g++ -std=c++20 -fsyntax-only -Isrc -I/tmp/neonrelay-syntax-probe/src -Isrc/engine/external \
            src/engine/http.cpp src/engine/shared/http_curl.cpp src/neonrelay/game_pairing_http.cpp

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute native HTTP worker against isolated TLS servers
        shell: bash
        run: |
          set -o pipefail
          if ! ./scripts/test_native_https.sh 2>&1 | tee "$RUNNER_TEMP/native-https.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          tail = Path(os.environ["RUNNER_TEMP"], "native-https.log").read_text()[-3500:]
          print("::error::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
            exit 1
          fi

  native-server:
    name: Linux server build and isolated boot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install server build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config libcurl4-openssl-dev libssl-dev libsqlite3-dev zlib1g-dev
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Compile and boot actual server target
        env:
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: |
          set -o pipefail
          if ! ./scripts/test_native_server.sh 2>&1 | tee "$RUNNER_TEMP/native-server.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          tail = Path(os.environ["RUNNER_TEMP"], "native-server.log").read_text()[-3500:]
          print("::error::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
            exit 1
          fi

  native-client:
    name: Linux client build and desktop/portrait boot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install client toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config libcurl4-openssl-dev libssl-dev libsqlite3-dev zlib1g-dev libsdl2-dev libfreetype6-dev libogg-dev libopus-dev libopusfile-dev libpng-dev libwavpack-dev libglew-dev libnotify-dev xvfb xauth xdotool imagemagick
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development map fixture tools
        run: python -m pip install -r scripts/requirements-map-tools.txt
      - name: Compile and render native client
        env:
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: |
          set -o pipefail
          if ! ./scripts/test_native_client.sh 2>&1 | tee "$RUNNER_TEMP/native-client.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          logs = list((root / "client-preview").glob("*.log")) + [root / "native-client.log"]
          tail = "\n".join(p.read_text(errors="replace")[-2200:] for p in logs)[-3500:]
          print("::error::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-preview
          path: ${{ runner.temp }}/client-preview/
          retention-days: 7

  # Builds the vendored ed25519-donna + match signer + CLI tool with plain
  # gcc/g++, signs fixed vectors and cross-verifies with node:crypto.
  match-signer:
    name: match-event signer (C++ <-> node:crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signer harness
        run: ./scripts/neonrelay_signer_test.sh

  backend:
    name: reward backend (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (zero runtime dependencies, no install step needed)
        run: cd backend && npm test

  onchain:
    name: anchor program offline checks (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merkle parity + program conformance tests
        run: cd onchain && npm test

name: Economy Rust and SBF tests
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "onchain/**"
      - ".github/workflows/economy-rust.yml"
  pull_request:
    paths:
      - "onchain/**"
      - ".github/workflows/economy-rust.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('onchain/Cargo.lock', 'onchain/Cargo.toml', 'onchain/**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      # Canonical fail-closed gate: the committed lock must pin the exact
      # Anchor 0.31.1 release family. A stale (0.30.x) lock is regenerated
      # from scratch with the same walk-back procedure as
      # scripts/macbook_release.sh — an in-place `cargo update` from the old
      # lock is the known-unresolvable path and is deliberately not used.
      # Every phase writes its failure context to the step summary AND the
      # pin-gate-log artifact, so a red run is diagnosable without raw logs.
      - name: Anchor 0.31.1 lockfile pin gate (regenerate if stale)
        shell: bash
        run: |
          set -uo pipefail
          cd onchain
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          LOG="$GITHUB_WORKSPACE/onchain/target/ci-pin-gate.log"
          mkdir -p target
          : > "$LOG"
          say() { echo "$1" | tee -a "$SUMMARY"; }
          fail() {
            say ""
            say "**FAIL: $1 — last 80 lines of the gate log:**"
            say '```'
            tail -n 80 "$LOG"
            say '```'
            # Also surface the tail as a check-run annotation: unlike the step
            # summary and raw logs, annotations are readable via the Checks
            # API (this sandbox cannot reach results-receiver / blob hosts).
            esc=$(tail -n 60 "$LOG" | awk '{gsub(/%/,"%25"); printf "%s%s",(NR>1?"%0A":""),$0}')
            echo "::error title=Pin-gate: $1::${esc}"
            exit 1
          }
          lock_version() {
            awk -v n="$1" '$0=="name = \""n"\""{f=1;next} f&&/^version = /{sub(/^version = \"/,"");sub(/".*/,"");print;exit}' Cargo.lock
          }
          PKGS=(anchor-attribute-access-control anchor-attribute-account anchor-attribute-constant
                anchor-attribute-error anchor-attribute-event anchor-attribute-program
                anchor-derive-accounts anchor-derive-serde anchor-derive-space
                anchor-syn anchor-lang anchor-spl)
          if node scripts/verify_toolchain_pin.mjs >>"$LOG" 2>&1; then
            say "onchain/Cargo.lock already pins Anchor 0.31.1 — using the committed lock as-is."
            exit 0
          fi
          say "::warning::committed onchain/Cargo.lock is not pinned to 0.31.1 — regenerating from scratch (needs crates.io)"
          rm -f Cargo.lock
          cargo generate-lockfile >>"$LOG" 2>&1 || fail "cargo generate-lockfile (fresh resolve of the full workspace graph)"
          for pkg in "${PKGS[@]}"; do
            v="$(lock_version "$pkg")"
            case "$v" in
              0.31.1) ;;
              0.31.*)
                say "  walk-back: $pkg $v -> 0.31.1"
                cargo update -p "$pkg@$v" --precise 0.31.1 >>"$LOG" 2>&1 || fail "cargo update $pkg@$v --precise 0.31.1"
                ;;
              *)
                say "::error::lock entry for $pkg is '$v' (expected 0.31.x)"
                exit 1
                ;;
            esac
          done
          node scripts/verify_toolchain_pin.mjs >>"$LOG" 2>&1 || fail "final pin verification (lock still off-pin after walk-back)"
          say "onchain/Cargo.lock regenerated and pinned to Anchor 0.31.1 (see pin-gate-log + economy-cargo-lock artifacts)."
          {
            echo ""
            echo "Regenerated lock family:"
            for pkg in "${PKGS[@]}"; do echo "- $pkg = $(lock_version "$pkg")"; done
          } >> "$SUMMARY"
      - name: Save pin-gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-gate-log
          path: onchain/target/ci-pin-gate.log
          if-no-files-found: ignore
      - name: Compile Anchor constraints and run workspace host tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path onchain/Cargo.toml --workspace --locked 2>&1 | tee "$GITHUB_WORKSPACE/onchain/target/workspace-test.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            # Surface the tail as a check-run annotation (raw logs / artifacts
            # are unreachable from the agent environment).
            esc=$(tail -n 60 "$GITHUB_WORKSPACE/onchain/target/workspace-test.log" | awk '{gsub(/%/,"%25"); printf "%s%s",(NR>1?"%0A":""),$0}')
            echo "::error title=cargo-test exit $status::${esc}"
            exit "$status"
          fi
      - name: Publish host test report to step summary
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            echo "## Neon Relay — Rust host test report"
            echo
            grep -E -B1 '^test result:' "$GITHUB_WORKSPACE/onchain/target/workspace-test.log" 2>/dev/null \
              | sed 's/^/  /' || echo '  (no test results captured)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save workspace test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-log
          path: onchain/target/workspace-test.log
          if-no-files-found: ignore
      - name: Install pinned Agave SBF build toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/agave.tar.bz2" \
            https://github.com/anza-xyz/agave/releases/download/v3.1.8/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "e951bb8127c57460bc3ebca1671952e9b164e249d713fcebe2c125f70b8791e8  $RUNNER_TEMP/agave.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build economy SBF binary (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          cargo-build-sbf --version
          cargo-build-sbf --manifest-path onchain/programs/neonrelay-economy/Cargo.toml \
            --sbf-out-dir "$GITHUB_WORKSPACE/onchain/target/deploy"
          sha256sum onchain/target/deploy/neonrelay_economy.so > onchain/target/deploy/economy-sbf.sha256
      - name: Execute runtime scenarios with economy SBF (no native fallback)
        env:
          RUST_LOG: "error"
          NEONRELAY_TEST_SBF: "1"
          BPF_OUT_DIR: ${{ github.workspace }}/onchain/target/deploy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --manifest-path onchain/Cargo.toml -p neonrelay-economy --test v2_runtime --locked -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/economy-sbf-test.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          text = Path(os.environ["RUNNER_TEMP"], "economy-sbf-test.log").read_text()
          tail = "\n".join(text.splitlines()[-100:])[-3500:]
          print("::error::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
            exit 1
          fi
      - name: Save SBF runtime report to step summary
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            echo "## Neon Relay — economy SBF runtime report"
            echo
            grep -E -B1 '^test result:' "$RUNNER_TEMP/economy-sbf-test.log" 2>/dev/null \
              | sed 's/^/  /' || echo '  (SBF stage not reached)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Isolated validator lifecycle and production backend RPC decoding
        shell: bash
        run: |
          set -o pipefail
          if ! onchain/scripts/test_local_validator.sh 2>&1 | tee "$RUNNER_TEMP/economy-validator-test.log"; then
            python3 - <<'PYLOG'
          import os
          from pathlib import Path
          text = Path(os.environ["RUNNER_TEMP"], "economy-validator-test.log").read_text()
          tail = "\n".join(text.splitlines()[-100:])[-3500:]
          print("::error::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYLOG
            exit 1
          fi
      - name: Save SBF binary and hash (never keypair files)
        uses: actions/upload-artifact@v4
        with:
          name: economy-sbf
          path: |
            onchain/target/deploy/neonrelay_economy.so
            onchain/target/deploy/economy-sbf.sha256
          if-no-files-found: error
      - name: Save resolved dependency lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy-cargo-lock
          path: onchain/Cargo.lock
          if-no-files-found: ignore

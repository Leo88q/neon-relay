version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      open-pull-requests-limit: 10
    labels: [dependencies, security]
  - package-ecosystem: npm
    directory: /onchain
    schedule:
      interval: weekly
      open-pull-requests-limit: 10
    labels: [dependencies, security]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, security]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]

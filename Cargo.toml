[workspace]
members = [
  "src/base",
  "src/engine",
  "src/engine/shared",
  "src/rust-bridge/test",
]

resolver = "2"

[workspace.dependencies]
# After updating the cxx version, you need to run
# `python scripts/generate_rust_bridge.py`.
cxx = "=1.0.194"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"
# Catalog 2026 §AH item 115 (Truebit, 8 Jan 2026 — integer overflow in a
# five-year-old price-curve contract): Rust release builds disable overflow
# checks by default, so arithmetic wraps silently in exactly the profile that
# reaches players. Enable them for the whole workspace; the rust-bridge surface
# is small and the hot paths are C++ (which is compiled with its own checks
# and sanitizers in CI), so the cost is bounded and the failure mode is a
# panic instead of a wrong number. `relwithdebinfo` and `minsizerel` inherit
# this profile. scripts/check_supply_chain.py enforces this line in CI.
overflow-checks = true

[profile.relwithdebinfo]
inherits = "release"
debug = true

[profile.minsizerel]
inherits = "release"
opt-level = "z"
